<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>应援滚动屏</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #000; }

  /* ===== 输入页 ===== */
  #setup {
    height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #000; color: #fff; padding: 24px; gap: 20px;
  }
  #setup h1 { font-size: 22px; font-weight: 600; letter-spacing: 2px; }
  #setup .hint { font-size: 13px; color: #888; }
  #textInput {
    width: 100%; max-width: 420px;
    padding: 14px 16px; font-size: 18px;
    background: #111; color: #fff;
    border: 1px solid #333; border-radius: 10px;
    outline: none; text-align: center;
  }
  #textInput:focus { border-color: #fff; }
  #startBtn {
    width: 100%; max-width: 420px;
    padding: 14px; font-size: 17px; font-weight: 600; letter-spacing: 4px;
    background: #fff; color: #000; border: none; border-radius: 10px;
    cursor: pointer;
  }
  #startBtn:active { opacity: .8; }
  #quickTags { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 420px; }
  #quickTags button {
    padding: 6px 14px; font-size: 13px;
    background: #111; color: #bbb;
    border: 1px solid #333; border-radius: 999px; cursor: pointer;
  }
  #quickTags button:active { color: #fff; border-color: #fff; }

  /* ===== 滚动屏 ===== */
  #screen { position: fixed; inset: 0; background: #000; display: none; }
  #stage { position: absolute; left: 50%; top: 50%; transform-origin: center; }
  #marqueeWrap {
    position: absolute; left: 0; right: 0;
    top: 50%; transform: translateY(-50%);
    overflow: hidden; white-space: nowrap;
  }
  #marquee {
    display: inline-block; color: #fff; font-weight: 700;
    padding-left: 100vw; /* 保证从右侧屏幕外进入 */
    will-change: transform;
  }
  #screen .exit {
    position: absolute; top: max(12px, env(safe-area-inset-top)); right: 14px;
    padding: 8px 18px; font-size: 14px;
    background: rgba(255,255,255,.08); color: #fff;
    border: 1px solid rgba(255,255,255,.25); border-radius: 999px;
    cursor: pointer; opacity: .35; transition: opacity .3s;
  }
  #screen .exit:hover, #screen .exit:active { opacity: 1; }
  #screen .ctrls {
    position: absolute; bottom: max(14px, env(safe-area-inset-bottom)); left: 0; right: 0;
    display: flex; justify-content: center; align-items: center; gap: 18px;
    opacity: .3; transition: opacity .3s;
  }
  #screen .ctrls:hover, #screen .ctrls:active { opacity: 1; }
  #screen .ctrls label {
    display: flex; align-items: center; gap: 8px;
    color: #fff; font-size: 14px;
  }
  #screen .ctrls input[type="range"] {
    width: 130px; accent-color: #fff; cursor: pointer;
  }
  #toast {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    max-width: 80vw; padding: 14px 22px;
    background: rgba(255,255,255,.92); color: #000;
    font-size: 15px; border-radius: 12px; text-align: center; line-height: 1.6;
    opacity: 0; transition: opacity .4s; pointer-events: none;
  }
  #toast.show { opacity: 1; }
  #screen.ui-hidden .exit, #screen.ui-hidden .ctrls { opacity: 0; pointer-events: none; }
</style>
</head>
<body>

<!-- 输入页 -->
<div id="setup">
  <h1>应援滚动屏</h1>
  <div class="hint">输入想滚动的话，点击开始，把手机横过来举起来吧</div>
  <input id="textInput" type="text" placeholder="输入应援文字…" maxlength="50" autocomplete="off">
  <div id="quickTags">
    <button data-text="我爱你">我爱你</button>
    <button data-text="辛苦了">辛苦了</button>
    <button data-text="今天也超棒！">今天也超棒！</button>
    <button data-text="永远支持你">永远支持你</button>
    <button data-text="前进！">前进！</button>
  </div>
  <button id="startBtn">开 始 应 援</button>
</div>

<!-- 滚动屏 -->
<div id="screen">
  <div id="stage">
    <div id="marqueeWrap"><div id="marquee">文字</div></div>
  </div>
  <button class="exit" id="exitBtn">退出</button>
  <div class="ctrls">
    <label>速度<input type="range" id="speedRange" min="40" max="1500" step="10"></label>
    <label>字号<input type="range" id="sizeRange" min="24" max="1200" step="2"></label>
  </div>
  <div id="toast"></div>
</div>

<script>
(function () {
  var input = document.getElementById('textInput');
  var screen = document.getElementById('screen');
  var stage = document.getElementById('stage');
  var marquee = document.getElementById('marquee');
  var toast = document.getElementById('toast');

  var speed = 120;     // px/秒
  var fontSize = 60;   // px
  var pos = 0, last = 0, raf = null;
  var unitWidth = 0;   // 单个文字单元宽度（无缝循环用）
  var wakeLock = null;

  // ===== 布局：横屏直接铺满；竖屏把舞台旋转 90°，让文字沿长边滚动 =====
  function layout() {
    var w = window.innerWidth, h = window.innerHeight;
    if (w >= h) {
      stage.style.width = w + 'px';
      stage.style.height = h + 'px';
      stage.style.transform = 'translate(-50%,-50%) rotate(0deg)';
    } else {
      stage.style.width = h + 'px';
      stage.style.height = w + 'px';
      stage.style.transform = 'translate(-50%,-50%) rotate(90deg)';
    }
    // 字号上限动态跟随屏幕短边：拉满即基本撑满屏幕高度（留 5% 防裁切）
    var maxFont = Math.floor(Math.min(w, h) * 0.95);
    sizeRange.max = maxFont;
    if (fontSize > maxFont) {
      fontSize = maxFont;
      marquee.style.fontSize = fontSize + 'px';
      sizeRange.value = fontSize;
    }
  }
  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', layout);

  // ===== 亮度保持：Wake Lock 防止屏幕自动变暗/熄灭 =====
  function requestWakeLock() {
    if (navigator.wakeLock && navigator.wakeLock.request) {
      navigator.wakeLock.request('screen').then(function (wl) {
        wakeLock = wl;
      }).catch(function () {});
    }
  }
  function releaseWakeLock() {
    if (wakeLock) { wakeLock.release().catch(function(){}); wakeLock = null; }
  }
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && screen.style.display === 'block') requestWakeLock();
  });

  // ===== 提示 =====
  var toastTimer = null;
  function showToast(msg, ms) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.classList.remove('show'); }, ms || 3000);
  }

  document.querySelectorAll('#quickTags button').forEach(function (b) {
    b.addEventListener('click', function () {
      input.value = b.dataset.text;
      input.focus();
    });
  });

  document.getElementById('startBtn').addEventListener('click', start);
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') start();
  });

  function start() {
    var text = (input.value || '').trim();
    if (!text) { input.focus(); return; }
    // 无缝循环：文字单元重复 3 份，滚过一个单元宽度就补位，消除黑屏等待
    marquee.textContent = '';
    for (var i = 0; i < 3; i++) {
      var u = document.createElement('span');
      u.textContent = text + '\u3000\u3000';
      marquee.appendChild(u);
    }
    marquee.style.fontSize = fontSize + 'px';
    unitWidth = marquee.firstChild.offsetWidth;
    speedRange.value = speed;
    sizeRange.value = fontSize;
    pos = 0;
    layout();
    screen.style.display = 'block';
    if (document.documentElement.requestFullscreen) {
      document.documentElement.requestFullscreen().catch(function(){});
    }
    screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape').catch(function(){});
    requestWakeLock();
    // 浏览器无法改系统背光，提醒用户手动拉满亮度
    setTimeout(function () {
      showToast('网页无法直接调系统亮度\n请手动把亮度拉满，效果最佳', 3500);
    }, 400);
    last = performance.now();
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(tick);
    showUI(); // 进入后 4 秒无操作自动隐藏 UI
  }

  function tick(now) {
    var dt = (now - last) / 1000;
    last = now;
    pos -= speed * dt;
    if (unitWidth > 0 && -pos >= unitWidth) pos += unitWidth; // 无缝补位
    marquee.style.transform = 'translateX(' + pos + 'px)';
    raf = requestAnimationFrame(tick);
  }

  document.getElementById('exitBtn').addEventListener('click', exit);

  // ===== UI 自动隐藏：点击屏幕空白处切换显示/隐藏，4 秒无操作自动隐藏 =====
  var uiTimer = null;
  function showUI() {
    screen.classList.remove('ui-hidden');
    clearTimeout(uiTimer);
    uiTimer = setTimeout(hideUI, 4000);
  }
  function hideUI() { screen.classList.add('ui-hidden'); }

  screen.addEventListener('pointerdown', function () {
    // 任何触摸（包括拖滑条）都会重置自动隐藏倒计时
    if (!screen.classList.contains('ui-hidden')) showUI();
  });
  screen.addEventListener('click', function (e) {
    // 点空白处：UI 隐藏时唤出，UI 显示时隐藏
    if (e.target === screen || e.target === stage || e.target.id === 'marqueeWrap') {
      if (screen.classList.contains('ui-hidden')) showUI(); else hideUI();
    }
  });

  function exit() {
    cancelAnimationFrame(raf);
    screen.style.display = 'none';
    screen.classList.remove('ui-hidden');
    clearTimeout(uiTimer);
    releaseWakeLock();
    if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(function(){});
  }

  var speedRange = document.getElementById('speedRange');
  var sizeRange = document.getElementById('sizeRange');
  speedRange.addEventListener('input', function () { speed = +speedRange.value; });
  sizeRange.addEventListener('input', function () {
    fontSize = +sizeRange.value;
    marquee.style.fontSize = fontSize + 'px';
    if (marquee.firstChild) unitWidth = marquee.firstChild.offsetWidth;
  });
})();
</script>
</body>
</html>
